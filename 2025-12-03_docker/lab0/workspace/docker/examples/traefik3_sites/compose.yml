services:
  example:
    image: sikalabs/hello-world-server:v0.6.0
    labels:
      - traefik.enable=true
      - traefik.http.routers.example.rule=Host(`example.lab0.sikademo.com`)
      - traefik.http.services.example.loadbalancer.server.port=8000
    networks:
      - traefik
    deploy:
      replicas: 4
  nginx:
    image: nginx
    labels:
      - traefik.enable=true
      - traefik.http.routers.nginx.rule=Host(`nginx.lab0.sikademo.com`)
    networks:
      - traefik
  apache:
    image: httpd
    labels:
      - traefik.enable=true
      - traefik.http.routers.apache.rule=Host(`apache.lab0.sikademo.com`)
    networks:
      - traefik
  caddy:
    image: caddy:2
    labels:
      - traefik.enable=true
      - traefik.http.routers.caddy.rule=Host(`caddy.lab0.sikademo.com`)
    networks:
      - traefik

networks:
  traefik:
    name: traefik
    external: true
