apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hello-adecco
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io/foreground
spec:
  project: default
  destination:
    namespace: counter-from-helm
    server: https://kubernetes.default.svc
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://github.com/sikalabs/charts
    path: ./charts/hello-world
    helm:
      valuesObject:
        host: hello-adecco.aks.sikademo.com
        image: ghcr.io/sikalabs/hello-world-server:adecco
        ingressClassName: haproxy
        TEXT_SUFFIX: v2
