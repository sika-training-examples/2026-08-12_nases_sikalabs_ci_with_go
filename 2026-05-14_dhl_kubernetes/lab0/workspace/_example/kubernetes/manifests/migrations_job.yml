apiVersion: batch/v1
kind: Job
metadata:
  name: migrations
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-for-redis
          image: ghcr.io/sikalabs/slu:v0.100.0
          command: [ slu, wait-for, tcp, --address, redis:6379 ]
      containers:
        - name: main
          image: redis:8
          command:
            - /bin/sh
            - -c
          args:
            - "redis-cli -h redis incrby counter 50000 && sleep 15 && redis-cli -h redis incrby counter 50000 && echo Done."
