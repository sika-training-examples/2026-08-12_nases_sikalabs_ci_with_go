apiVersion: apps/v1
kind: Deployment
metadata:
  name: backup-server
spec:
  revisionHistoryLimit: 0
  replicas: 2
  selector:
    matchLabels:
      app: backup-server
  template:
    metadata:
      labels:
        app: backup-server
    spec:
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: backup
      containers:
        - name: main
          image: sikalabs/nginx-public
          ports:
            - containerPort: 80
          volumeMounts:
            - name: data
              mountPath: /usr/share/nginx/html
          resources:
            requests:
              cpu: 40m
              memory: 50Mi
            limits:
              cpu: 80m
              memory: 100Mi
