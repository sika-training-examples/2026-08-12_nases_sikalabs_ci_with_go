apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ccc
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
  source:
    repoURL: https://gitlab.sikademo.com/training/ondrejsika.git
    path: examples/manifests_in_application/apps/ccc/manifests
