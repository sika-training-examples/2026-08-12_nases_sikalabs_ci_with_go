name: simple
services:
  redis:
    image: redis:7
    command:
      - /bin/sh
      - -c
      - sleep 10 && redis-server
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli ping
      interval: 2s
      retries: 10
  app:
    build: .
    image: ttl.sh/ondrej/counter-py
    environment:
      REDIS: redis
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      replicas: 4
    labels:
      traefik.enable: "true"
      traefik.http.routers.counter.rule: Host(`localhost`) || Host(`127.0.0.1`)

  traefik:
    image: traefik:v3
    command:
      - --metrics.prometheus=true
      - --api.insecure=true
      - --accesslog=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  redis_data:

