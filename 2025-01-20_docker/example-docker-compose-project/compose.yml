name: counter
services:
  mongodb:
    image: mongo
    healthcheck:
      test: echo 'db.stats().ok' | mongosh localhost:27017/test --quiet
      interval: 1s
      retries: 5
    volumes:
      - mongodb:/data/db
    networks:
      - backend

  backend:
    build: ./backend
    image: ${IMAGE_BACKEND:-backend}
    depends_on:
      mongodb:
        condition: service_healthy
    environment:
      BACKEND: mongodb
      MONGODB_URI: mongodb://mongodb:27017
      EXTRA_TEXT: "🐋"
    healthcheck:
      test: curl -f http://localhost/readyz
      interval: 1s
      retries: 5
    networks:
      - backend
      - frontend
    deploy:
      replicas: ${BACKEND_REPLICAS:-1}

  frontend:
    build: ./frontend
    image: ${IMAGE_FRONTEND:-frontend}
    depends_on:
      backend:
        condition: service_healthy
    environment:
      API_ORIGIN: http://backend
      FONT_COLOR: white
      BACKGROUND_COLOR: black
    healthcheck:
      test: curl -f http://localhost:3000/api/livez
      interval: 1s
      retries: 5
    networks:
      - frontend
    deploy:
      replicas: ${FRONTEND_REPLICAS:-1}

networks:
  backend:
  frontend:

volumes:
  mongodb:
