apiVersion: v1
kind: Service
metadata:
  name: vault0
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
    apps.kubernetes.io/pod-index: "0"  
  ports:
    - port: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: vault1
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
    apps.kubernetes.io/pod-index: "1"  
  ports:
    - port: 8200
---
apiVersion: v1
kind: Service
metadata:
  name: vault2
spec:
  publishNotReadyAddresses: true
  selector:
    app.kubernetes.io/name: vault
    apps.kubernetes.io/pod-index: "2"  
  ports:
    - port: 8200
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: vault-extra
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - vault0.k8s.sikademo.com
        - vault1.k8s.sikademo.com
        - vault2.k8s.sikademo.com
      secretName: vault-extra-tls
  rules:
    - host: vault0.k8s.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault0
                port:
                  number: 8200
    - host: vault1.k8s.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault1
                port:
                  number: 8200
    - host: vault2.k8s.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: vault2
                port:
                  number: 8200                              