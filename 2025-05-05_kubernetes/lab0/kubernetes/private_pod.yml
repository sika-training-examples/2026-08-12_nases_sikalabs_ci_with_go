apiVersion: v1
kind: Pod
metadata:
  name: private-pod
  labels:
    svc: example
spec:
  imagePullSecrets:
    - name: private-registry-credentials
  containers:
    - name: hello
      image: ondrejsika/training-example
      ports:
        - containerPort: 80
      env:
        - name: TEXT
          value: "Hello from private pod!"
      resources:
        requests:
          memory: 10Mi
          cpu: 10m
        limits:
          memory: 20Mi
          cpu: 20m
---
apiVersion: v1
kind: Secret
metadata:
  name: private-registry-credentials
type: kubernetes.io/dockerconfigjson
stringData:
  .dockerconfigjson: '{"auths": {"ghcr.io": {"username": "pseudo-private-user", "password": "asdfasdf"}}}'
