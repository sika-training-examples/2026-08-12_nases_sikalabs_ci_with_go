apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: frontend
  namespace: example
spec:
  releaseName: frontend
  chart:
    spec:
      chart: counter-frontend
      sourceRef:
        kind: HelmRepository
        name: example
        namespace: flux-system
      version: "0.2.0"
  interval: 1m
  values:
    host: example-frontend.k8s.sikademo.com
    API_ORIGIN: http://backend-counter
    replicas: 2
