apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: simple
  namespace: simple01
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - simple.k8s.sikademo.com
      secretName: simple.k8s.sikademo.com-tls
  rules:
    - host: simple.k8s.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: simple
                port:
                  number: 80