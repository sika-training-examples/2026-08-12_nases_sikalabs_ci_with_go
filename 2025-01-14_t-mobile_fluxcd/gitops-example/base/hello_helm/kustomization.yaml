apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- helm_repo_sikalabs.yaml
- namespace.yaml
- helm_release.yaml

configMapGenerator:
  - name: hello-helm-values-common
    namespace: hello-helm
    files:
      - values.yaml

generatorOptions:
  disableNameSuffixHash: true
