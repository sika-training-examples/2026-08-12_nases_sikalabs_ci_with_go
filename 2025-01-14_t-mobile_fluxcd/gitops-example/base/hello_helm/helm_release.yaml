apiVersion: helm.toolkit.fluxcd.io/v2beta1
kind: HelmRelease
metadata:
  name: hello-helm
  namespace: hello-helm
spec:
  releaseName: hello
  chart:
    spec:
      chart: hello-world
      sourceRef:
        kind: HelmRepository
        name: sikalabs
        namespace: flux-system
      version: 0.14.0
  interval: 1m
  valuesFrom:
    - kind: ConfigMap
      name: hello-helm-values-common
    - kind: ConfigMap
      name: hello-helm-values