apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-fe
spec:
  revisionHistoryLimit: 0
  replicas: {{ .Values.frontendReplicas }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-fe
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-fe
    spec:
      initContainers:
        - name: wait-for-be
          image: sikalabs/slu:v0.91.0
          args:
            - /bin/sh
            - -c
            - slu wait-for tcp -a {{ .Release.Name }}-be:80
      containers:
        - name: main
          image: ghcr.io/ondrejsika/counter-frontend-go
          ports:
            - containerPort: 3000
          env:
            - name: API_ORIGIN
              value: http://{{ .Release.Name }}-be
            - name: FAIL_ON_ERROR
              value: '1'
            - name: FONT_COLOR
              value: {{ .Values.FONT_COLOR | quote }}
            {{- if .Values.BACKGROUND_COLOR }}
            - name: BACKGROUND_COLOR
              value: {{ .Values.BACKGROUND_COLOR | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /api/livez
              port: 3000
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
            limits:
              cpu: 200m
              memory: 200Mi
