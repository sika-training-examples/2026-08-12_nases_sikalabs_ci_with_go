apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webservers
spec:
  tls:
    - hosts:
        - nginx.apps.okd.aws.sikademo.com
      secretName: my-tls
  rules:
    - host: nginx.apps.okd.aws.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example-okd
                port:
                  name: http
