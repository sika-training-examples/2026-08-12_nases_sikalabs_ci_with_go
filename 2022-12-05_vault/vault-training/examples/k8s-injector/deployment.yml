apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello
  labels:
    app: hello
spec:
  selector:
    matchLabels:
      app: hello
  template:
    metadata:
      annotations:
        vault.hashicorp.com/agent-inject: 'true'
        vault.hashicorp.com/template-static-secret-render-interval: 10s
        vault.hashicorp.com/role: 'hello'
        vault.hashicorp.com/agent-inject-secret-database-config.txt: 'secret-k8s/data/database/config'
        vault.hashicorp.com/agent-inject-template-database-config.txt: |
          {{- with secret "secret-k8s/data/database/config" -}}
          postgresql://{{ .Data.data.username }}:{{ .Data.data.password }}@postgres:5432/wizard
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-database-config-2.txt: 'database/creds/postgres'
        vault.hashicorp.com/agent-inject-template-database-config-2.txt: |
          {{- with secret "database/creds/postgres" -}}
          postgresql://{{ .Data.username }}:{{ .Data.password }}
          {{- end -}}
        vault.hashicorp.com/agent-inject-secret-database-dotenv: 'database/creds/postgres'
        vault.hashicorp.com/agent-inject-template-database-dotenv: |
          {{- with secret "database/creds/postgres" -}}
          export DB_USER={{ .Data.username }}
          export DB_PASSWORD={{ .Data.password }}
          {{- end -}}
      labels:
        app: hello
    spec:
      serviceAccountName: hello
      containers:
        - name: main
          image: ondrejsika/serve
          ports:
            - containerPort: 80
        - name: env-example
          image: debian
          command:
            - /bin/sh
            - -c
            - . /vault/secrets/database-dotenv && env | grep DB_ && sleep 99999
          ports:
            - containerPort: 80
