apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: caddy
  annotations:
    # alb.ingress.kubernetes.io/ssl-redirect: '443'
    alb.ingress.kubernetes.io/scheme: internet-facing
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTPS":443}]'
    # alb.ingress.kubernetes.io/certificate-arn: aws:...:certificate/...
    # external-dns specific configuration for creating route53 record-set
    external-dns.alpha.kubernetes.io/hostname: caddy.aws0.sikademo.com
spec:
  ingressClassName: alb
  rules:
    - host: caddy.aws0.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
                  # name: http
