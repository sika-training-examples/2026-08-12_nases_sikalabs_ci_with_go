apiVersion: apps/v1
kind: Deployment
metadata:
  name: startup
  labels:
    app: startup
spec:
  replicas: 10
  selector:
    matchLabels:
      app: startup
  template:
    metadata:
      labels:
        app: startup
        svc: example
    spec:
      containers:
        - image: sikalabs/slu:v0.64.0
          command:
            - /bin/sh
            - -c
          args:
            - slu sleep random --min 0 --max 30000 && slu example-server -p 80
          name: main
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            failureThreshold: 2
          startupProbe:
            httpGet:
              path: /
              port: 80
            failureThreshold: 30
          ports:
            - containerPort: 80
          resources:
            requests:
              memory: 10Mi
              cpu: 20m
            limits:
              memory: 200Mi
              cpu: 500m
---
apiVersion: v1
kind: Service
metadata:
  name: startup
spec:
  type: ClusterIP
  selector:
    app: startup
  ports:
    - port: 80
