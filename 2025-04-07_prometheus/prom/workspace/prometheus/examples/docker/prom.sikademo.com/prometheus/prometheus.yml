global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
  - job_name: push-gateway
    metric_relabel_configs:
      - source_labels: [exported_job]
        target_label: job
      - source_labels: [exported_instance]
        target_label: instance
      - regex: "exported_instance|exported_job"
        action: labeldrop
    static_configs:
      - targets:
          - prom.sikademo.com:9091
  - job_name: node-exporter
    static_configs:
      - targets:
          - prom.sikademo.com:9100
          - vm0.sikademo.com:9100
          - vm1.sikademo.com:9100
          - vm2.sikademo.com:9100
          - lab0.sikademo.com:9100
          - lab1.sikademo.com:9100
          - lab2.sikademo.com:9100
          - lab3.sikademo.com:9100
          - lab4.sikademo.com:9100
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+)(.sikademo.com)(:[0-9]+)?"
        replacement: "${1}"
  - job_name: cadvisor
    static_configs:
      - targets:
          - prom.sikademo.com:9338
          - vm0.sikademo.com:9338
          - vm1.sikademo.com:9338
          - vm2.sikademo.com:9338
          - lab0.sikademo.com:9338
          - lab1.sikademo.com:9338
          - lab2.sikademo.com:9338
          - lab3.sikademo.com:9338
          - lab4.sikademo.com:9338
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+)(.sikademo.com)(:[0-9]+)?"
        replacement: "${1}"
  - job_name: random-metrics
    static_configs:
      - targets:
          - vm0.sikademo.com:9001
          - vm0.sikademo.com:9002
          - vm0.sikademo.com:9003
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+)(.sikademo.com)(:[0-9]+)?"
        replacement: "${1}"
  - job_name: metgen
    static_configs:
      - targets:
          - vm0.sikademo.com:9011
          - vm0.sikademo.com:9012
          - vm0.sikademo.com:9013
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+)(.sikademo.com)(:[0-9]+)?"
        replacement: "${1}"
  - job_name: postgres
    static_configs:
      - targets:
          - postgres.sikademo.com:9187
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+)(.sikademo.com)(:[0-9]+)?"
        replacement: "${1}"
  - job_name: mysql
    static_configs:
      - targets:
          - mysql.sikademo.com:9104
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        regex: "(.+)(.sikademo.com)(:[0-9]+)?"
        replacement: "${1}"
  - job_name: "blackbox"
    metrics_path: /probe
    params:
      module:
        - http_2xx
    static_configs:
      - targets:
          - https://ondrejsika.com
          - https://ondrejsika.int
          - https://sika.io
          - https://sika.int
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: prom.sikademo.com:9115

