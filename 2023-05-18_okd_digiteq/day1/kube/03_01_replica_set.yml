apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: hello-world-rs
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hello-world-rs
  template:
    metadata:
      labels:
        app: hello-world-rs
        svc: example
    spec:
      containers:
        - name: main
          image: ondrejsika/training-example-okd
          ports:
            - containerPort: 8000
          # env:
          #   - name: PORT
          #     value: "8000"
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
