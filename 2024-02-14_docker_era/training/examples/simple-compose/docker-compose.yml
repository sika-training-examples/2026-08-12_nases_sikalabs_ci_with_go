version: '3.8'
services:
  traefik:
    image: traefik:v2.9
    command:
      - --metrics.prometheus=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.http.address=:80
    ports:
      - "8000:80"
      - "8081:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
  app:
    labels:
      traefik.enable: "true"
      traefik.http.routers.counter.rule: Host(`lab0.sikademo.com`)
    build: .
    image: ttl.sh/simple-compose
    environment:
      REDIS: redis
    deploy:
      replicas: 4
  redis:
    image: redis
    volumes:
      - redis-data:/data
volumes:
  redis-data: