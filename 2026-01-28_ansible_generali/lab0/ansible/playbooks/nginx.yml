---
- name: Setup Web Server
  hosts: all
  gather_facts: false

  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        update_cache: yes
        state: present
    - name: Start Nginx
      service:
        name: nginx
        state: started
    - name: Copy index.html
      copy:
        src: index.html
        dest: /var/www/html
        owner: root
        group: root
        mode: 0644
    - name: Create user ondrejsika
      include_role:
        name: my_create_user
      vars:
        username: ondrejsika
        ssh_key: ssh-rsa  ondrejsika
    - name: See
      debug:
        msg: "See: http://{{ ansible_host }}"
