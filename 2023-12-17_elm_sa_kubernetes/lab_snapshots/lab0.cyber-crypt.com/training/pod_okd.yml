apiVersion: v1
kind: Pod
metadata:
  name: example-okd
  labels:
    svc: example-okd
spec:
  containers:
    - name: main
      image: ghcr.io/cybercryptio/training-example
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: 10Mi
          cpu: 10m
        limits:
          memory: 20Mi
          cpu: 20m
      securityContext:
        runAsUser: 1000
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
