apiVersion: v1
kind: Pod
metadata:
  name: iceland
  labels:
    app: iceland
    svc: example
spec:
  containers:
    - name: main
      image: ondrejsika/iceland-2
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: 20Mi
          cpu: 10m
        limits:
          memory: 40Mi
          cpu: 20m
