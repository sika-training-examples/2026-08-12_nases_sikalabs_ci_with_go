apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: medina
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  rules:
    - host: medina.jeddah.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: medina
                port:
                  number: 80