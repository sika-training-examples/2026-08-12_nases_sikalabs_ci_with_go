apiVersion: v1
kind: Namespace
metadata:
  name: prague
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: prague
  namespace: prague
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: prague
  namespace: prague
rules:
  - apiGroups: ["*"]
    resources: ["*"]
    verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: prague
  namespace: prague
subjects:
  - kind: ServiceAccount
    name: prague
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: prague
