apiVersion: v1
kind: Pod
metadata:
  name: my-first-k8s
  labels:
    app: my-first-k8s
    svc: example
spec:
  containers:
    - name: main
      image: ghcr.io/cybercryptio/training-example
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: 10Mi
          cpu: 10m
        limits:
          memory: 20Mi
          cpu: 20m
