apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-world
  labels:
    release: hello-world
spec:
  replicas: 3
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      release: hello-world
  template:
    metadata:
      labels:
        release: hello-world
    spec:
      containers:
        - name: main
          image: sikalabs/hello-world-server
          ports:
            - name: http
              containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: hello-world
  labels:
    release: hello-world
spec:
  type: ClusterIP
  ports:
    - port: 80
      name: http
      targetPort: http
  selector:
    release: hello-world
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: hello-world
  labels:
    release: hello-world
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hello.k8s.sikademo.com
      secretName: hello-world-tls
  rules:
    - host: hello.k8s.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world
                port:
                  name: http
