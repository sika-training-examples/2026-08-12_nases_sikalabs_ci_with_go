apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: example3
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - bar.127-0-0-1.uk
      secretName: 127-0-0-1.uk-tls
  rules:
    - host: bar.127-0-0-1.uk
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: example
                port:
                  number: 80
