apiVersion: apps/v1
kind: Deployment
metadata:
  name: example-manifests
spec:
  revisionHistoryLimit: 0
  replicas: 2
  selector:
    matchLabels:
      app: example-manifests
  template:
    metadata:
      labels:
        app: example-manifests
    spec:
      containers:
        - name: main
          image: ghcr.io/sikalabs/hello-world-server:egd
          env:
            - name: TEXT_SUFFIX
              value: 'v2'
          ports:
            - name: http
              containerPort: 8000
            - name: metrics
              containerPort: 8001
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              memory: 20Mi
              cpu: 20m
          startupProbe:
            httpGet:
              path: /readyz
              port: 8000
          livenessProbe:
            httpGet:
              path: /livez
              port: 8000
