apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ingress
spec:
  ingressClassName: openshift-default
  rules:
    - host: hello-world.apps.egd.germanywestcentral.aroapp.io
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: hello-world-clusterip
                port:
                  number: 80
 