apiVersion: batch/v1
kind: CronJob
metadata:
  name: backup
spec:
  # https://crontab.guru/
  schedule: "* * * * *"
  concurrencyPolicy: Replace
  failedJobsHistoryLimit: 1
  successfulJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            job: backup
        spec:
          restartPolicy: OnFailure
          volumes:
            - name: backup
              persistentVolumeClaim:
                claimName: backup
          initContainers:
            - name: wait-for-redis
              image: sikalabs/slu:v0.80.0
              args:
                - /bin/sh
                - -c
                - slu wait-for tcp -a redis:6379
          containers:
            - name: main
              image: redis:8
              command:
                - /bin/bash
                - -c
                - redis-cli -h redis --rdb /backup/`date +%s`.rdb
              volumeMounts:
                - name: backup
                  mountPath: /backup
