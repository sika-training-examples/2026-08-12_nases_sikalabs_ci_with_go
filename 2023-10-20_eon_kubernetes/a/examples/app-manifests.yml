apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: manifests
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    repoURL: https://gitlab.sikademo.com/eon/ondrej.git
    path: examples/manifests
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
