apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-2
  namespace: argocd
spec:
  destination:
    namespace: example-2
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: https://gitlab.sikademo.com/eon/helm.git
    helm:
      releaseName: hello
      values: |
        

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
