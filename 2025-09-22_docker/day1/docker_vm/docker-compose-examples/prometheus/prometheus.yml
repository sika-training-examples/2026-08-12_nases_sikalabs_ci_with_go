global:
  scrape_interval: 15s

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets:
          - 127.0.0.1:9090
  - job_name: docker
    scheme: https
    static_configs:
      - targets:
        - cadvisor.docker.sikademo.com:443
        - cadvisor.lab0.sikademo.com:443
  - job_name: trafik
    static_configs:
      - targets:
        - lab0.sikademo.com:8080
        - docker.sikademo.com:8080
