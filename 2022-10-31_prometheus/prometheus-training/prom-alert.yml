global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets:
          - "localhost:9090"

  - job_name: "example-random"
    static_configs:
      - targets:
          - "localhost:8080"
          - "localhost:8081"
        labels:
          env: "prod"
      - targets:
          - "localhost:8082"
        labels:
          env: "dev"
  - job_name: "node-exporter"
    static_configs:
      - targets:
          - "example0.sikademo.com:9100"
          - "example1.sikademo.com:9100"
          - "example2.sikademo.com:9100"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"

rule_files:
  - "prom-alert.rules.yml"
