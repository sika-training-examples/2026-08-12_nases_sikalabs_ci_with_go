apiVersion: v1
kind: Pod
metadata:
  name: private-pod
  labels:
    svc: example
spec:
  containers:
    - name: hello
      image: registry.sikalabs.com/pseudo-private/hello-world:latest
      ports:
        - containerPort: 80
      resources:
        requests:
          memory: 10Mi
          cpu: 10m
        limits:
          memory: 20Mi
          cpu: 20m
