apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: example-1
  namespace: argocd
spec:
  destination:
    namespace: default
    server: https://kubernetes.default.svc
  project: default
  source:
    path: .
    repoURL: https://gitlab.sikalabs.com/ondrej/example-1.git
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
