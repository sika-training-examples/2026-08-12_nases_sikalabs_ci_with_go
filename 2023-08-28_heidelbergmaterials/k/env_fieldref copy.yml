apiVersion: v1
kind: Pod
metadata:
  name: env-fieldref
spec:
  containers:
    - name: main
      image: busybox
      command:
        - /bin/sh
        - -c
        - env | grep MY_
      env:
        - name: MY_NODE_NAME
          valueFrom:
            resourceFieldRef:
              containerName: main
              resource: limits.cpu
      resources:
        requests:
          cpu: 30m
          memory: 20Mi
        limits:
          cpu: 30m
          memory: 20Mi
  restartPolicy: Never
