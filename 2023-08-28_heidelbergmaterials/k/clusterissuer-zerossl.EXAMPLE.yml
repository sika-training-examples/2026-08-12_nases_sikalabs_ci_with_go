apiVersion: v1
kind: Secret
metadata:
  name: zerossl-eab
  namespace: cert-manager
stringData:
  secret: REPLACE_WITH_KEY_SECRET
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zerossl
spec:
  acme:
    server: https://acme.zerossl.com/v2/DV90
    email: REPLACE_WITH_ZEROSSL_EMAIL
    privateKeySecretRef:
      name: zerossl
    externalAccountBinding:
      keyID: REPLACE_WITH_KEY_ID
      keySecretRef:
        name: zerossl-eab
        key: secret
    solvers:
      - http01:
          ingress:
            class: nginx
