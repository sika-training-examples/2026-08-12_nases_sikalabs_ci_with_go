apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webservers-paths2
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - 2.os.sikademo.com
      secretName: webservers-paths2-tls
  rules:
    - host: 2.os.sikademo.com
      http:
        paths:
          - path: /demo
            pathType: Prefix
            backend:
              service:
                name: example
                port:
                  number: 80
          - path: /nginx
            pathType: Prefix
            backend:
              service:
                name: nginx
                port:
                  number: 80
          - path: /apache
            pathType: Prefix
            backend:
              service:
                name: apache
                port:
                  number: 80
          - path: /caddy
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
