coder:
  env:
    - name: CODER_PG_CONNECTION_URL
      valueFrom:
        secretKeyRef:
          name: coder-db-url
          key: url
    - name: CODER_ACCESS_URL
      value: "https://coder.ondrejsika.sikademo.com"
  service:
    type: ClusterIP
  ingress:
    enable: true
    annotations:
      kubernetes.io/ingress.class: "nginx"
      cert-manager.io/cluster-issuer: "letsencrypt"
    host: "coder.ondrejsika.sikademo.com"
    tls:
      enable: true
      secretName: coder-certs
