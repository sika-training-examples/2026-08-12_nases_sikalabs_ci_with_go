apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert
    kompose.version: 1.34.0 (HEAD)
  labels:
    io.kompose.service: backend
  name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: backend
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert
        kompose.version: 1.34.0 (HEAD)
      labels:
        io.kompose.service: backend
    spec:
      containers:
        - env:
            - name: EXTRA_TEXT
              value: PSS
            - name: PORT
              value: "8000"
            - name: REDIS
              value: redis
            - name: SLOW_START
              value: "10"
          image: ondrejsika/counter
          name: backend
      restartPolicy: Always
