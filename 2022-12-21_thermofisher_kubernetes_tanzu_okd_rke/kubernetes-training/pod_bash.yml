apiVersion: v1
kind: Pod
metadata:
  name: dev
spec:
  containers:
    - name: main
      image: debian:11-slim
      command:
        - /bin/bash
        - sleep
        - "9999999999"
      resources:
        requests:
          memory: 100Mi
          cpu: 500m
        limits:
          memory: 1000Mi
          cpu: 1000m
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault

