---
- name: Set Facts Example
  hosts: all
  gather_facts: false
  vars:
    list: []

  tasks:
    # - set_fact:
    #     list: []

    - shell:
        cmd: echo ahoj
      register: msg

    - set_fact:
        list: "{{ list + [msg.stdout] }}"

    - shell:
        cmd: echo hello
      register: msg

    - set_fact:
        list: "{{ list + [msg.stdout] }}"

    - debug:
        msg: "{{ list }}"
