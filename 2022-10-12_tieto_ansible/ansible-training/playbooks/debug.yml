---
- name: Debug Example
  hosts: all
  gather_facts: false

  tasks:
    - name: Print message
      debug:
        msg: "Hello World!"

- name: Debug Example with facts
  hosts: all

  tasks:
    - name: Print message
      debug:
        msg: "Hello World from {{ ansible_facts['hostname'] }} ({{ ansible_facts['eth0']['ipv4']['address'] }})!"

- name: Debug Example with variables
  hosts: all

  tasks:
    - name: Print variable
      debug:
        var: ansible_facts['eth0']['ipv4']