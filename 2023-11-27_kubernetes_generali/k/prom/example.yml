apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-example
  labels:
    app: metrics-example
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: metrics-example
  replicas: 5
  template:
    metadata:
      labels:
        app: metrics-example
    spec:
      containers:
        - name: metrics-example
          image: ondrejsika/metrics-example
          ports:
            - name: http
              containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 10Mi
            limits:
              memory: 20Mi
              cpu: 20m
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-example
  labels:
    app: metrics-example
spec:
  selector:
    app: metrics-example
  ports:
    - name: http
      port: 80
      protocol: TCP
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webservers
spec:
  rules:
    - host: metrics-example.k8sdb.cpas.cz
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: metrics-example
                port:
                  number: 80
