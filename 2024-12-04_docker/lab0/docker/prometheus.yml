global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "cadvisor"
    static_configs:
      - targets:
          - "localhost:18080"

  - job_name: "cadvisor2"
    scheme: https
    static_configs:
      - targets:
          - "cadvisor.docker.sikademo.com:443"

  - job_name: "traefik"
    static_configs:
      - targets:
          - "docker.sikademo.com:8080"