services:
  counter:
    build: .
    image: ttl.sh/dte/simple-compose/counter
    labels:
      traefik.enable: 'true'
      traefik.http.services.counter.loadbalancer.server.port: 80
      traefik.http.routers.counter.rule: Host(`counter-local.sikademo.com`)
      traefik.http.routers.counter.entrypoints: http,https
      traefik.http.routers.counter.tls.certresolver: le
    depends_on:
      - redis
    deploy:
      replicas: 4
    environment:
      REDIS: redis
  redis:
    image: redis
    volumes:
      - redis-data:/data

volumes:
  redis-data:
