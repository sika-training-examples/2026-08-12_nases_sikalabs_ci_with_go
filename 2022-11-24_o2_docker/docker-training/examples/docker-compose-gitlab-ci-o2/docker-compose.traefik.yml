version: "3.9"
services:
  counter:
    deploy:
      replicas: 2
  traefik:
    image: traefik:1.7
    command: |
      --web \
      --docker \
      --docker.watch \
      --entryPoints="Name:http Address::80" \
      --docker.exposedbydefault=false
    ports:
      - 80:80
      - 8080:8080
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock

