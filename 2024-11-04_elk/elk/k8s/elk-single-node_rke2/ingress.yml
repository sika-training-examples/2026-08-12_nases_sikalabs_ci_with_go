apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: main
  namespace: elk
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - es.rke2.sikademo.com
        - kb.rke2.sikademo.com
      secretName: main-tls
  rules:
    - host: es.rke2.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-es-http
                port:
                  number: 9200
    - host: kb.rke2.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: main-kb-http
                port:
                  number: 5601
