filebeat.inputs:
  - type: filestream
    paths:
      - /tmp/java.log
    parsers:
      - multiline:
          type: pattern
          pattern: '^[[:space:]]+(at|\.{3})[[:space:]]+\b|^Caused by:'
          negate: false
          match: after

