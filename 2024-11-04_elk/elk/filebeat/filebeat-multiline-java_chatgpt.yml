filebeat.inputs:
  - type: filestream
    paths:
      - /tmp/java.log
    parsers:
      - multiline:
          pattern: '^\s+|^Caused by:'  # Matches lines starting with whitespace or "Caused by:"
          negate: false
          match: after  

