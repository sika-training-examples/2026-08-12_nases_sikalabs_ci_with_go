filebeat.inputs:
  - ID: aaa
    type: filestream
    paths:
      - /tmp/json.log
      - /tmp/plaintext.log

processors:
  - drop_fields:
      fields:
        - log
        - input
        - ecs
        - host

  - decode_json_fields:
      fields:
        - message
      target: ""
      overwrite_keys: true
      add_error_key: true

  - dissect:
      when:
        equals:
          error.type: json
      tokenizer: "%{prefix} %{date} %{time} %{level} %{message} (i=%{i|integer})"
      field: "message"
      target_prefix: ""
      overwrite_keys: true
      add_error_key: true

  - add_tags:
      when:
        equals:
          error.type: json
      tags:
        - dissect

  - drop_fields:
      fields:
        - error
      when:
        contains:
          tags: dissect

  - drop_event:
      when:
        or:
          - equals:
              level: "debug"
          - equals:
              level: "info"

  - script:
      when:
        contains:
          tags: dissect
      lang: javascript
      source: |
        function process(event) {
            event.Put("timestamp", event.Get("date")+"T"+event.Get("time")+"Z")
            event.Put("level", event.Get("level").toLowerCase())
            event.Delete("date")
            event.Delete("time")
        }

  - timestamp:
      field: timestamp
      layouts:
        - '2006/01/02T15:04:05Z'

  - drop_fields:
      fields:
        - timestamp

