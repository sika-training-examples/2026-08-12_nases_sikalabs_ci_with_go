version: "3.8"
name: counter
services:
  counter:
    build: .
    image: reg.istry.cz/dte/multiple-composes/counter
    platform: linux/amd64
    depends_on:
      - redis
    labels:
      traefik.enable: "true"
      traefik.http.routers.counter.rule: Host(`counter.slkp2.uk`)
      traefik.http.routers.counter.entrypoints: http,https
      traefik.http.routers.counter.tls.certresolver: le

  redis:
    image: redis
    volumes:
      - redis-data:/data

volumes:
  redis-data:
