server:
  http_listen_port: 9080
  grpc_listen_port: 9095

positions:
  filename: /promtail_data/promtail_positions.yaml

clients:
  - url: ${LOKI_URL}
    external_labels:
      host: ${PROMTAIL_HOST}

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - target_label: job
        replacement: docker
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
