global:
  scrape_interval: 5s

scrape_configs:
  - job_name: "loki"
    static_configs:
      - targets:
          - "localhost:3100"
  - job_name: "promtail"
    static_configs:
      - targets:
          - "localhost:9080"
  - job_name: "node"
    static_configs:
      - targets:
          - "localhost:9100"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "localhost:9093"

rule_files:
  - "prometheus.rules.yml"