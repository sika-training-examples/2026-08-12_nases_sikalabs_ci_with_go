{{ if .Values.gatewayFrontendHost }}
apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: frontend-shared
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.gatewayClusterIssuer }}
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: {{ required ".Values.gatewayName is required" .Values.gatewayName }} # Gateway Name
    namespace: {{ required ".Values.gatewayNamespace is required" .Values.gatewayNamespace }}  # Gateway Namespace
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.hostPrefix }}{{ required ".Values.gatewayFrontendHost is requied" .Values.gatewayFrontendHost }}
      tls:
        mode: Terminate
        certificateRefs:
          - name: {{ .Values.hostPrefix }}{{ .Values.gatewayFrontendHost }}-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-shared
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: frontend-shared
      sectionName: https
  hostnames:
    - {{ .Values.hostPrefix }}{{ .Values.gatewayFrontendHost }}
  rules:
    - backendRefs:
        - name: frontend-shared
          port: 80
{{ end }}
