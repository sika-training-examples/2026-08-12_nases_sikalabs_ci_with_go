apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-shared
  annotations:
    cert-manager.io/cluster-issuer: {{ .Values.clusterIssuer }}
spec:
  tls:
    - hosts:
        - {{ .Values.hostPrefix }}{{ required ".Values.frontendHost is required" .Values.frontendHost }}
      secretName: {{ .Values.hostPrefix }}{{ .Values.frontendHost }}-tls
  rules:
    - host: {{ .Values.hostPrefix }}{{ .Values.frontendHost }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-shared
                port:
                  number: 80
