apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: frontend-go
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  tls:
    - hosts:
        - argocd-counter-manifests-go.k8s.sikademo.com
      secretName: argocd-counter-manifests-go.k8s.sikademo.com-tls
  rules:
    - host: argocd-counter-manifests-go.k8s.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-go
                port:
                  number: 80
