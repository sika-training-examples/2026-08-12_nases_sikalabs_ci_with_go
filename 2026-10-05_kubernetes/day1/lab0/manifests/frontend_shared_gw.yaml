apiVersion: gateway.networking.k8s.io/v1
kind: ListenerSet
metadata:
  name: frontend-shared
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-gw
    acme.cert-manager.io/http01-parentreffallback: "true"
spec:
  parentRef:
    name: gw # Gateway Name
    namespace: gw # Gateway Namespace
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: frontend.gw.sikademo.com
      tls:
        mode: Terminate
        certificateRefs:
          - name: frontend.gw.sikademo.com-tls
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-shared
spec:
  parentRefs:
    - group: gateway.networking.k8s.io
      kind: ListenerSet
      name: frontend-shared
      sectionName: https
  hostnames:
    - frontend.gw.sikademo.com
  rules:
    - backendRefs:
        - name: frontend-shared
          port: 80
