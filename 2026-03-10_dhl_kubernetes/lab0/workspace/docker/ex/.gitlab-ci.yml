image: ghcr.io/sikalabs/ci

variables:
  IMAGE_BACKEND: "$CI_REGISTRY_IMAGE/backend:$CI_COMMIT_REF_SLUG"
  IMAGE_FRONTEND: "$CI_REGISTRY_IMAGE/frontend:$CI_COMMIT_REF_SLUG"
  IMAGE_CADDY: "$CI_REGISTRY_IMAGE/caddy:$CI_COMMIT_REF_SLUG"
  IMAGE_TESTS: "$CI_REGISTRY_IMAGE/tests:$CI_COMMIT_REF_SLUG"

stages:
  - build
  - test
  - deploy

before_script:
  - docker login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"

build:
  stage: build
  variables:
    COMPOSE_FILE: "compose.yml:compose.caddy.yml:compose.tests.yml"
  script:
    - docker compose build --progress=plain
    - docker compose push

tests:
  stage: test
  variables:
    COMPOSE_FILE: "compose.yml:compose.tests.yml"
    COMPOSE_PROJECT_NAME: "ci_tests_$CI_JOB_ID"
  script:
    - docker compose pull
    - docker compose run tests
  after_script:
    - docker compose down --remove-orphans --volumes

ab:
  stage: test
  variables:
    COMPOSE_FILE: "compose.yml:compose.tests.yml"
    COMPOSE_PROJECT_NAME: "ci_ab_$CI_JOB_ID"
  script:
    - docker compose pull
    - docker compose run ab-be-api
    - docker compose run ab-be
    - docker compose run ab-fe
  after_script:
    - docker compose down --remove-orphans --volumes

deploy:
  stage: deploy
  variables:
    COMPOSE_FILE: "compose.yml:compose.traefik.yml"
    COMPOSE_PROJECT_NAME: "counter_$CI_COMMIT_REF_SLUG"
    TRAEFIK_NAME: "counter_$CI_COMMIT_REF_SLUG"
    HOST: "counter-$CI_COMMIT_REF_SLUG.docker.sikademo.com"

    DOCKER_DOMAIN: "docker.sikademo.com"
    DOCKER_HOST: "ssh://root@$DOCKER_DOMAIN"

  environment:
    name: $CI_COMMIT_REF_SLUG
    url: "https://$HOST"
    on_stop: stop

  script:
    - mkdir -p ~/.ssh
    - cat $SSH_PRIVATE_KEY > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $DOCKER_DOMAIN >> ~/.ssh/known_hosts
    - docker compose pull
    - docker compose up -d

stop:
  stage: deploy
  when: manual
  variables:
    GIT_STRATEGY: none
    COMPOSE_PROJECT_NAME: "counter_$CI_COMMIT_REF_SLUG"

    DOCKER_DOMAIN: "docker.sikademo.com"
    DOCKER_HOST: "ssh://root@$DOCKER_DOMAIN"

  environment:
    name: $CI_COMMIT_REF_SLUG
    action: stop
  script:
    - mkdir -p ~/.ssh
    - cat $SSH_PRIVATE_KEY > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan $DOCKER_DOMAIN >> ~/.ssh/known_hosts
    - docker ps -a -f label=com.docker.compose.project=$COMPOSE_PROJECT_NAME --format "{{.ID}}" | xargs --no-run-if-empty docker rm -f
