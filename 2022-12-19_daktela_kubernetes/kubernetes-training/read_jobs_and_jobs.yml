apiVersion: v1
kind: ServiceAccount
metadata:
  name: read-jobs-and-pods
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-jobs-and-pods
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-jobs-and-pods
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: read-jobs-and-pods
subjects:
  - kind: ServiceAccount
    name: read-jobs-and-pods
  - kind: ServiceAccount
    name: default