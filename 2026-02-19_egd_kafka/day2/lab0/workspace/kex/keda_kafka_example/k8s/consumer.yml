apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
spec:
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: consumer
  replicas: 1
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: main
          image: ttl.sh/ondrejsika/example-keda-consumer
          env:
            - name: KAFKA_BROKER_ADDRESS
              value: brno-kafka-bootstrap.kafka.svc:9092
            - name: KAFKA_TOPIC
              value: brno-keda
            - name: KAFKA_GROUP_ID
              value: default
          resources:
            requests:
              cpu: 10m
              memory: 20Mi
            limits:
              cpu: 200m
              memory: 200Mi
