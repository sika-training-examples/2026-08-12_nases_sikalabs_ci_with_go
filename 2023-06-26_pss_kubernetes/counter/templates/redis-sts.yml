apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Release.Name }}-redis
  annotations:
    argocd.argoproj.io/sync-options: Replace=true
spec:
  serviceName: redis
  {{ if .Values.storage }}
  volumeClaimTemplates:
    - metadata:
        name: redis
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 1Gi
  {{ end }}
  selector:
    matchLabels:
      app: {{ .Release.Name }}-redis
  replicas: 1
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-redis
    spec:
      containers:
        - name: redis
          image: redis
          command:
            - redis-server
          args:
            - --appendonly
            - 'yes'
          resources:
            requests:
              cpu: 30m
              memory: 50Mi
          ports:
            - containerPort: 6379
          {{ if .Values.storage }}
          volumeMounts:
            - mountPath: /data
              name: redis
          {{ end }}
      {{ if .Values.storage }}
      volumes:
        - name: redis
          persistentVolumeClaim:
            claimName: redis
      {{ end }}
