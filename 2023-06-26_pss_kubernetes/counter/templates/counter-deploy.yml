
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-counter
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-counter
  replicas: {{ .Values.replicas }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-counter
    spec:
      containers:
        - name: counter
          image: ondrejsika/counter
          resources:
            requests:
              cpu: 20m
              memory: 10Mi
          env:
            - name: REDIS
              value: {{ .Release.Name }}-redis
          ports:
            - containerPort: 80
