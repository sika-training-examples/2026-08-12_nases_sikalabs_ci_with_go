apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pvc-mount-example
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - ondrejsika-pvc-mount-example2.k8s.sikademo.com
      secretName: ondrejsika-pvc-mount-example2.k8s.sikademo.com-tls
  rules:
    - host: ondrejsika-pvc-mount-example2.k8s.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pvc-mount-example
                port:
                  number: 80