---
- name: Setup Web Server
  hosts: all
  gather_facts: false
  tasks:
    - name: Install Nginx
      apt:
        name: nginx
        state: present
    - name: Copy index.html from template
      template:
        src: gv.html.j2
        dest: /var/www/html/index.html
        owner: root
        group: root
        mode: 0644
