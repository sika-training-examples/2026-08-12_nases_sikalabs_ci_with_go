version: "3.9"
services:
  traefik:
    image: traefik:1.7
    command: |
      --accesslog \
      --api \
      --metrics \
      --metrics.prometheus \
      --metrics.prometheus.entryPoint="traefik" \
      --web \
      --docker \
      --docker.watch \
      --docker.network=traefik \
      --docker.exposedbydefault=false \
      --entryPoints="Name:http Address::80"
    userns_mode: host
    restart: always
    ports:
      - "80:80"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./acme-data:/acme-data
    networks:
      - traefik
networks:
  traefik:
    name: traefik
