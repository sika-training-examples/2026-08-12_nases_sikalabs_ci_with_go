services:
  counter:
    build: .
    image: ttl.sh/docker-training/simple-compose-go/counter
    labels:
      traefik.enable: "true"
      traefik.http.routers.counter.rule: Host(`lab0.sikademo.com`)
      traefik.http.routers.counter.tls.certresolver: le
    deploy:
      replicas: 4
    depends_on:
      redis:
        condition: service_healthy
    environment:
      REDIS: redis
      SLOW_START: 2
    healthcheck:
      test: curl -f http://localhost/readyz
      interval: 1s
      retries: 20

  foo:
    image: sikalabs/hello-world-server
    labels:
      traefik.enable: "true"
      traefik.http.routers.foo.rule: Host(`foo.lab0.sikademo.com`)
      traefik.http.routers.foo.tls.certresolver: le
    environment:
      TEXT: foo
    deploy:
      replicas: 4
  bar:
    image: sikalabs/hello-world-server
    labels:
      traefik.enable: "true"
      traefik.http.routers.bar.rule: Host(`bar.lab0.sikademo.com`)
      traefik.http.routers.bar.tls.certresolver: le
    environment:
      TEXT: bar
    deploy:
      replicas: 4
  redis:
    image: redis
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli ping
      interval: 1s
      retries: 20

  traefik:
    image: traefik:v3.3
    command:
      # - --metrics.prometheus=true
      # - --api.insecure=true
      # - --accesslog=true
      # - --providers.docker=true
      # - --providers.docker.exposedbydefault=false
      # - --entrypoints.http.address=:80
      - --accesslog
      - --metrics.prometheus=true
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --providers.docker.network=traefik
      - --entrypoints.http.address=:80
      - --entrypoints.http.http.redirections.entryPoint.to=https
      - --entrypoints.http.http.redirections.entryPoint.scheme=https
      - --entrypoints.https.address=:443
      - --certificatesresolvers.le.acme.httpchallenge=true
      - --certificatesresolvers.le.acme.httpchallenge.entrypoint=http
      - --certificatesresolvers.le.acme.email=le@sikademo.com
      - --certificatesresolvers.le.acme.storage=/letsencrypt/acme.json
    ports:
      - "80:80"
      - 443:443
      - "8080:8080"
    volumes:
      - letsencrypt-data:/letsencrypt
      - /var/run/docker.sock:/var/run/docker.sock

  # caddy:
