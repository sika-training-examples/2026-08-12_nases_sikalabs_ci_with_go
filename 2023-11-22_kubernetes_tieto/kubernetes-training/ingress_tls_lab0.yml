apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webservers
  # annotations:
  #   cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - hello-from-lab0.lab0.sikademo.com
      secretName: sikademo-com-tls
  rules:
    - host: hello-from-lab0.lab0.sikademo.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: caddy
                port:
                  number: 80
