---
- name: When Debian vs Ubuntu Example
  hosts: all

  tasks:
    - name: Get hostname on Debian
      debug:
        msg: "Debian {{ ansible_facts['hostname'] }}" 
      when: ansible_facts['distribution'] == "Debian"

    - name: Get hostname on Ubuntu
      debug:
        msg: "Ubuntu {{ ansible_facts['hostname'] }}" 
      when: ansible_facts['distribution'] == "Ubuntu"
